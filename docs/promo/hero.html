<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:810px;overflow:hidden;background:#05070c;font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif;color:#eef2fa}
canvas#bg{position:absolute;inset:0}
.horizon{position:absolute;left:-10%;right:-10%;bottom:-260px;height:520px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,rgba(90,150,255,.55),rgba(60,90,255,.18) 40%,transparent 70%);filter:blur(10px);animation:breathe 5s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.75}to{opacity:1}}
.title{position:absolute;top:64px;left:0;right:0;text-align:center;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.eyebrow{font-size:14px;letter-spacing:6px;color:#8fb0ff;text-transform:uppercase}
h1{font-size:68px;font-weight:700;letter-spacing:1px;margin-top:14px;background:linear-gradient(180deg,#fff,#aab6cf);-webkit-background-clip:text;color:transparent}
.subs{position:relative;height:30px;margin-top:12px}
.subs div{position:absolute;left:0;right:0;font-size:20px;color:#9aa6bf;letter-spacing:.5px;opacity:0;animation:cap 2s ease both}
.subs div b{color:#fff;font-weight:600}
@keyframes cap{0%{opacity:0;transform:translateY(8px)}15%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.subs div.last{animation:caplast 1.6s ease both}
@keyframes caplast{0%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.stack{position:absolute;left:0;right:0;top:300px;height:440px;perspective:1800px}
.win{position:absolute;top:0;width:620px;height:390px;border-radius:16px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);opacity:0;animation:fly 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes fly{from{opacity:0;translate:0 120px}to{opacity:var(--o,1);translate:0 0}}
.w1{left:90px;transform:rotateY(28deg) translateZ(-160px);--o:.78;animation-delay:.2s}
.w2{left:300px;transform:rotateY(16deg) translateZ(-60px);animation-delay:.35s}
.w3{left:560px;transform:rotateY(-10deg) translateZ(40px);z-index:3;animation-delay:.5s}
.w4{left:760px;transform:rotateY(-24deg) translateZ(-120px);--o:.85;animation-delay:.65s}
.side{position:absolute;left:0;top:0;bottom:0;width:150px;padding:16px 12px;font-size:10px}
.side i{display:block;height:8px;border-radius:4px;margin:10px 0;opacity:.45}
.side i.on{opacity:1}
.main{position:absolute;left:150px;right:0;top:0;bottom:0;padding:52px 36px}
.hello{font-size:22px;font-weight:600}
.composer{position:absolute;left:36px;right:36px;bottom:30px;height:76px;border-radius:18px}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.rim::before{content:"";position:absolute;inset:-1.5px;border-radius:19.5px;padding:1.5px;background:conic-gradient(from var(--a),#669DF6,#9B72CB,#D97757,#4fd1c5,#669DF6);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite}
.rim::after{content:"";position:absolute;inset:-14px;border-radius:30px;background:conic-gradient(from var(--a),rgba(102,157,246,.25),rgba(155,114,203,.2),rgba(217,119,87,.2),rgba(79,209,197,.2),rgba(102,157,246,.25));filter:blur(16px);z-index:-1;animation:spin 3s linear infinite}
@keyframes spin{to{--a:360deg}}
.ghost{position:absolute;left:18px;top:16px;font-size:12px;white-space:nowrap;overflow:hidden;width:0;animation:type 1.4s steps(14) both;animation-delay:4.2s}
@keyframes type{to{width:210px}}
.pill{position:absolute;right:14px;bottom:12px;font-size:10px;padding:4px 10px;border-radius:99px}
.mascot{position:absolute;right:70px;bottom:104px;display:flex;gap:6px}
.mascot b{width:22px;height:18px;border-radius:3px;display:block;animation:hop .45s ease-in-out infinite alternate}
.mascot b+b{animation-delay:.2s}
@keyframes hop{to{transform:translateY(-8px)}}
.card{margin-top:22px;border-radius:12px;padding:14px;height:130px}
.bars i{display:block;height:7px;border-radius:4px;margin:9px 0}
/* model picker popover on center window */
.pop{position:absolute;right:20px;bottom:116px;width:230px;border-radius:14px;padding:10px;font-size:11px;opacity:0;transform:translateY(10px) scale(.97);animation:pop 2.2s ease both;animation-delay:6.1s;box-shadow:0 18px 40px rgba(0,0,0,.18)}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.97)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
.pop .r{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px}
.pop .sl{height:5px;border-radius:5px;margin:10px 8px 4px;position:relative;overflow:hidden}
.pop .sl i{position:absolute;inset:0 34% 0 0;border-radius:5px;background:linear-gradient(90deg,#669DF6,#9B72CB,#D97757)}
</style></head><body>
<canvas id="bg" width="1440" height="810"></canvas>
<div class="horizon"></div>
<div class="title">
  <div class="eyebrow">Seven Appearance · for DeepSeek Harness</div>
  <h1>Seven 外观</h1>
  <div class="subs">
    <div style="animation-delay:.6s"><b>四套光学配色</b> · 黑曜 · 暖炭 · 晶白 · 暖陶</div>
    <div style="animation-delay:2.4s"><b>棱镜边光</b> · 贴合输入框真实轮廓流转</div>
    <div style="animation-delay:4.2s"><b>下一步提示词</b> · <code>Tab</code> 填入 · <code>⇧Tab</code> 换一条</div>
    <div style="animation-delay:6.1s"><b>统一模型选择器</b> · 推理等级一拨就换</div>
    <div class="last" style="animation-delay:8.2s">让 DeepSeek Harness <b>更好看，也更好用</b></div>
  </div>
</div>
<div class="stack" id="stack"></div>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');const ch='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const cw=9,chh=16,cols=160,rows=51;const g=[];for(let i=0;i<cols*rows;i++)g.push(ch[Math.random()*ch.length|0]);
let t=0;function draw(){x.fillStyle='#05070c';x.fillRect(0,0,1440,810);x.font='12px Menlo,monospace';
for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){const yy=r*chh;const d=Math.hypot(k*cw-720,(yy-760)*1.8);const w=Math.sin(d/38-t*2.2)*.5+.5;
const base=.05+.22*Math.pow(r/rows,2.2);const a=base*(.55+.45*w);if(Math.random()<.004)g[r*cols+k]=ch[Math.random()*ch.length|0];
const blue=r/rows;x.fillStyle=`rgba(${110-60*blue|0},${150+20*blue|0},255,${a})`;x.fillText(g[r*cols+k],k*cw,yy+12);}
t+=1/60;requestAnimationFrame(draw)}draw();
const P=[
 {n:'Obsidian',bg:'#0e0e11',sd:'#09090b',fg:'#e6e9f0',mu:'#2a2d36',cmp:'#16171c',acc:'#669DF6'},
 {n:'Warm',bg:'#141413',sd:'#10100f',fg:'#efe7dc',mu:'#2e2a25',cmp:'#1c1b19',acc:'#D97757'},
 {n:'Crystal',bg:'#f4f7fb',sd:'#e8eef6',fg:'#1d2433',mu:'#d3dbe7',cmp:'#ffffff',acc:'#3b6fe0'},
 {n:'Alabaster',bg:'#f6f4ee',sd:'#ebe6dc',fg:'#2b2620',mu:'#ddd5c6',cmp:'#fffdf8',acc:'#b0683d'}];
const S=document.getElementById('stack');
P.forEach((q,i)=>{const w=document.createElement('div');w.className='win w'+(i+1);w.style.background=q.bg;w.style.color=q.fg;
const pop=i===2?`<div class="pop" style="background:${q.cmp};border:1px solid ${q.mu}"><div class="r" style="background:${q.sd};font-weight:600"><span>DeepSeek V4</span><span>★</span></div><div class="r"><span>Codex · GPT</span><span>⌘⇧M</span></div><div class="r"><span>AWS Quick · Smart</span><span></span></div><div class="sl" style="background:${q.mu}"><i></i></div></div>`:'';
w.innerHTML=`<div class="side" style="background:${q.sd}"><div style="font-weight:600;font-size:11px">Seven · ${q.n}</div>${[60,80,50,70,40,65].map((v,j)=>`<i class="${j==1?'on':''}" style="width:${v}%;background:${j==1?q.acc:q.fg}"></i>`).join('')}</div>
<div class="main"><div class="hello">下午好，今天做点什么？</div>
<div class="card bars" style="background:${q.cmp};border:1px solid ${q.mu}"><i style="width:40%;background:${q.acc}"></i><i style="width:85%;background:${q.mu}"></i><i style="width:70%;background:${q.mu}"></i><i style="width:55%;background:${q.mu}"></i></div>
<div class="mascot"><b style="background:#D97757"></b><b style="background:#9B72CB"></b></div>${pop}
<div class="composer rim" style="background:${q.cmp}"><span class="ghost" style="color:${q.fg};opacity:.4">继续，把测试也跑一遍再提交 ⇥</span><span class="pill" style="background:${q.mu};color:${q.fg}">DeepSeek V4 · 高</span></div></div>`;S.appendChild(w)});
</script></body></html>
