<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0b0d12;font-family:-apple-system,"PingFang SC",sans-serif;color:#e8ecf4}
.stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;animation:show 2s linear both}
@keyframes show{0%{opacity:0;transform:translateY(12px)}12%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
.s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.s5{animation-delay:8s;animation-name:showend}
@keyframes showend{0%{opacity:0;transform:translateY(12px)}12%{opacity:1;transform:none}100%{opacity:1}}
h1{font-size:64px;font-weight:700;letter-spacing:2px}
h2{font-size:40px;font-weight:600;margin-bottom:36px}
.sub{font-size:22px;color:#8f9bb3;margin-top:18px}
.tag{font-size:16px;color:#7aa2ff;letter-spacing:4px;margin-bottom:14px}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.box{width:760px;height:120px;border-radius:28px;position:relative;background:#141821;padding:28px 32px;font-size:22px;color:#c9d2e3}
.box::before{content:"";position:absolute;inset:-2px;border-radius:30px;padding:2px;background:conic-gradient(from var(--a),#4f7cff,#a46bff,#ff7ab6,#ffb86b,#4fd1c5,#4f7cff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2s linear infinite}
@keyframes spin{to{--a:360deg}}
.ghost{color:#5b6478}
.kbd{display:inline-block;border:1px solid #3a4256;border-radius:6px;padding:1px 8px;font-size:15px;color:#9aa6bf;margin-left:10px}
.themes{display:flex;gap:22px}
.th{width:220px;height:140px;border-radius:22px;padding:18px;font-size:18px;font-weight:600;display:flex;align-items:flex-end;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.picker{width:640px;border-radius:22px;background:#141821;border:1px solid #262c3a;padding:18px}
.row{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;font-size:19px}
.row.on{background:#1f2a44;color:#fff}
.slider{margin:16px 14px 4px;height:8px;border-radius:8px;background:#262c3a;position:relative}
.slider i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#4f7cff,#a46bff);animation:fill 1.6s ease-out both;animation-delay:6.2s;width:0}
@keyframes fill{to{width:66%}}
.pets{display:flex;gap:40px;margin-top:10px}
.px{width:96px;height:96px;display:grid;grid-template-columns:repeat(8,1fr);animation:hop .5s ease-in-out infinite alternate}
.px span{display:block}
@keyframes hop{to{transform:translateY(-14px)}}
.logo{width:96px;height:96px;border-radius:26px;background:conic-gradient(from 200deg,#4f7cff,#a46bff,#ff7ab6,#ffb86b,#4fd1c5,#4f7cff);margin-bottom:28px;box-shadow:0 0 60px rgba(120,120,255,.35)}
.url{font-family:ui-monospace,Menlo,monospace;font-size:20px;color:#7aa2ff;margin-top:22px}
</style></head><body><div class="stage">
<section class="scene s1"><div class="logo"></div><h1>Seven 外观</h1><div class="sub">让 DeepSeek Harness 更好看，也更好用</div></section>
<section class="scene s2"><div class="tag">THEMES</div><h2>四套深浅主题 · 一键切换</h2><div class="themes"><div class="th" style="background:#10141d;color:#7aa2ff;border:1px solid #23304d">Obsidian 黑曜</div><div class="th" style="background:#1c1816;color:#e59a6b;border:1px solid #3a2c24">Warm 暖炭</div><div class="th" style="background:#f4f7fb;color:#3b5bd6">Crystal 晶白</div><div class="th" style="background:#f6f0e6;color:#a8643a">Alabaster 暖陶</div></div></section>
<section class="scene s3"><div class="tag">PRISM · SUGGEST</div><h2>棱镜边光 · 下一步提示词推荐</h2><div class="box">继续<span class="ghost">，把测试也跑一遍再提交</span><span class="kbd">Tab</span><span class="kbd">⇧Tab 换一条</span></div></section>
<section class="scene s4"><div class="tag">MODEL PICKER</div><h2>统一模型与推理选择器</h2><div class="picker"><div class="row on"><span>aws-quick / smart</span><span>★</span></div><div class="row"><span>deepseek / v4</span><span>⌘⇧M</span></div><div class="row"><span>codex / gpt</span><span></span></div><div class="slider"><i></i></div></div></section>
<section class="scene s5"><div class="pets" id="pets"></div><h2 style="margin:34px 0 0">像素伙伴 · 本地壁纸 · 划词解释</h2><div class="url">npm i dsh-seven-appearance</div></section>
</div>
<script>
const B='#4f7cff',L='#9ab6ff',K='#0b0d12',P='#ff7ab6';
const whale=['........','..BBBB..','.BBBBBB.','BBKBBBBB','BLLLLLBB','.LLLLLB.','..B..B..','........'];
const cat=['P......P','PP....PP','PPPPPPPP','PKPPPPKP','PPPPPPPP','.PPPPPP.','.P....P.','........'];
const map={B,L,K,P,'.':'transparent'};
const pets=document.getElementById('pets');
[whale,cat,whale].forEach((g,i)=>{const d=document.createElement('div');d.className='px';d.style.animationDelay=(i*.15)+'s';g.join('').split('').forEach(c=>{const s=document.createElement('span');s.style.background=map[c];d.appendChild(s)});pets.appendChild(d)});
</script></body></html>
